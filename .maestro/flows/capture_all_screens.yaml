appId: br.com.tradingplan.priceactionmaster
---
- launchApp:
    clearState: false

# 1. Tela Inicial
- assertVisible: "Price Action Master"
- takeScreenshot: screenshots/01_home_screen

# 2. Tela de Candlesticks
- tapOn:
    text: "Candlesticks"
    optional: true
- assertVisible: "Candlesticks"
- takeScreenshot: screenshots/02_candlesticks_atlas

# 3. Tela de Calculadoras
- tapOn:
    text: "Calculadoras"
    optional: true
- assertVisible: "Calculadoras"
- takeScreenshot: screenshots/03_calculadoras_multi_mercado

# 4. Tela de Quiz
- tapOn:
    text: "Quiz"
    optional: true
- assertVisible: "Quiz de Trading"
- takeScreenshot: screenshots/04_desafios_quiz

# 5. Tela de Ajustes
- tapOn:
    text: "Ajustes"
    optional: true
- assertVisible: "Ajustes"
- takeScreenshot: screenshots/05_ajustes_configuracoes

# 6. Retorna para Home
- tapOn:
    text: "Home"
    optional: true
- assertVisible: "Price Action Master"
