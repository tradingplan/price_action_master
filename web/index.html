<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Price Action Master">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Price Action Master" />
  <meta property="og:description" content="Price Action Master - Guia Prático e Simulador de Mercado Financeiro" />
  <meta property="og:image" content="assets/images/app_launcher_icon.png" /> 
  <meta name="twitter:title" content="Price Action Master" />
  <meta name="twitter:description" content="Price Action Master - Guia Prático e Simulador de Mercado Financeiro" />
  <meta name="twitter:image" content="assets/images/app_launcher_icon.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>Price Action Master</title>
  <meta name="description" content="Price Action Master - Guia Prático e Simulador de Mercado Financeiro" />
    
  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" content="#FFFFFF">

  <link rel="manifest" href="manifest.json">
  
  <style>
    @font-face {
      font-family: 'ITCErasStd';
      src: url('assets/assets/fonts/ITCErasStd-Medium.woff2') format('woff2'),
           url('assets/assets/fonts/ITCErasStd-Medium.ttf') format('truetype'),
           url('assets/fonts/ITCErasStd-Medium.woff2') format('woff2'),
           url('assets/fonts/ITCErasStd-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
